<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>入出庫履歴一覧</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>入出庫履歴一覧</h2>

    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>操作日</th>
                <th>区分</th>
                <th>材料名</th>
                <th>ロット</th>
                <th>数量</th>
                <th>製品名 (ロット)</th>
                <th>備考</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="tx : ${transactionList}">
                <td th:text="${tx.transactionDate}">2026-06-16</td>
                <td th:text="${tx.transactionType}">IN</td>
                <td th:text="${tx.materialName}">小麦粉</td>
                <td th:text="${tx.lotNumber}">L-001</td>
                <td th:text="${#numbers.formatDecimal(tx.quantityChange, 1, 'COMMA', 1, 'POINT')}">10.0</td>
                
                <td>
                    <span th:if="${tx.productName != null}" 
                          th:text="${tx.productName} + ' (' + ${tx.productNumber} + ')'"></span>
                    <span th:if="${tx.productName == null}">-</span>
                </td>
                
                <td th:text="${tx.note}">-</td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
