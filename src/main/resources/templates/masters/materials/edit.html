<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">情報編集</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <script th:src="@{/js/common.js}"></script>
</head>
<body>
    <header th:replace="~{fragments/common :: headerNav('/materials', '登録情報の編集', 'edit')}"></header>

    <form id="editForm" th:action="@{/materials/edit/{id}(id=${materialForm.id})}" method="post" th:object="${materialForm}">
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{materialType}" />
        
        <div th:replace="~{fragments/input :: text('名前', 'name', 'editName')}"></div>
        <div th:replace="~{fragments/input :: text('単位', 'unit', 'editUnit')}"></div>
        <div th:replace="~{fragments/input :: radio-powder('種類', 'isPowder', 'editIsPowder')}"></div>
        
        <button type="button" class="btn btn-action"
            th:onclick="openConfirmModal('editForm', 'confirmModal', 'confirmContent', 
            ['editName', 'editUnit', 'editIsPowderTrue'], 
            ['名前', '単位', '種類'], '更新')">更新</button>
    </form>
    <dialog th:replace="~{fragments/input :: confirm-modal}"></dialog>
</body>
</html>
