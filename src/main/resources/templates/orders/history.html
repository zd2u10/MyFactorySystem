<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>受注履歴（ログ）</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
	<div class="header-nav">
	        <a th:href="@{/home}" class="btn btn-back">← ホームに戻る</a>
	</div>
	
    <div class="nav-container">
        <h1>管理システム</h1>
        <h2>受注履歴（全件）</h2>
    </div>

    <div style="margin-bottom: 20px;">
        <a th:href="@{/orders/list}" class="btn btn-edit">未出荷一覧へ戻る</a>
    </div>

    <table class="content-table">
        <thead>
            <tr>
                <th>注文番号</th>
                <th>受注日</th>
                <th>注文者</th>
                <th>商品内容</th>
                <th>状態</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="order : ${orderList}">
                <td th:text="${order.id}">1</td>
                <td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd')}">2026-06-19</td>
                <td th:text="${order.customerName}">Admin1</td>
                <td th:text="${order.itemSummary}">ラーメンウェーブ x200</td>
                
                <td th:switch="${order.status}">
                    <span th:case="'OPEN'" style="color: #d32f2f; font-weight: bold;">未出荷</span>
                    <span th:case="'SHIPPED'" style="color: #388e3c; font-weight: bold;">出荷済み</span>
                    <span th:case="'CANCEL'" style="color: #757575;">キャンセル</span>
                </td>
                
                <td>
                    <a th:href="@{/orders/detail/{id}(id=${order.id})}" class="btn btn-back">詳細</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
