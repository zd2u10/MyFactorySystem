<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>受注詳細</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
	<div class="header-nav">
	        <a th:href="@{/home}" class="btn btn-back">← ホームに戻る</a>
	</div>
	
    <div class="nav-container">
        <h1>管理システム</h1>
        <a href="javascript:history.back();" class="btn btn-back">一覧/履歴に戻る</a>
        <h2>受注詳細</h2>
    </div>

    <div class="detail-card" style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
        <p><strong>注文番号:</strong> <span th:text="${order.id}"></span></p>
        <p><strong>注文者:</strong> <span th:text="${order.customerName}"></span></p>
        <p><strong>受注日:</strong> <span th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd')}"></span></p>
        <p><strong>現在の状態:</strong> 
            <span th:switch="${order.status}">
                <strong th:case="'OPEN'" style="color: #d32f2f;">未出荷</strong>
                <strong th:case="'SHIPPED'" style="color: #388e3c;">出荷済み</strong>
                <strong th:case="'CANCEL'" style="color: #757575;">キャンセル</strong>
            </span>
        </p>
    </div>

    <h3>注文明細</h3>
    <table class="content-table">
        <thead>
            <tr>
                <th>商品名</th>
                <th>注文数</th>
                <th>単位</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${orderItems}">
                <td th:text="${item.itemName}">ラーメンウェーブ</td>
                <td th:text="${#numbers.formatDecimal(item.quantity, 0, 0)}">200</td>
                <td th:text="${item.salesUnit}">個</td>
            </tr>
        </tbody>
    </table>

    <div th:if="${order.status == 'OPEN'}" style="margin-top: 30px; display: flex; gap: 15px;">
        
        <form th:action="@{/orders/detail/{id}/status(id=${order.id})}" method="post">
            <input type="hidden" name="status" value="SHIPPED">
            <button type="submit" class="btn btn-save" style="font-size: 1.2em; padding: 10px 20px;">
                <span class="icon">📦</span> この注文を出荷完了にする
            </button>
        </form>

        <form th:action="@{/orders/detail/{id}/status(id=${order.id})}" method="post" onsubmit="return confirm('本当にこの注文をキャンセルしますか？');">
            <input type="hidden" name="status" value="CANCEL">
            <button type="submit" class="btn btn-delete" style="padding: 10px 20px;">
                注文をキャンセル
            </button>
        </form>
    </div>

</body>
</html>
